name: Publish AUR Package

# Fires when a draft release is manually published
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.2.2)'
        required: false
        default: ''

jobs:
  publish-aur:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve release tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp version into PKGBUILD
        run: |
          sed -i "s|^pkgver=.*|pkgver=${VERSION}|" packaging/arch/kova-bin/PKGBUILD
          sed -i "s|^pkgrel=.*|pkgrel=1|" packaging/arch/kova-bin/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: kova-bin
          pkgbuild: packaging/arch/kova-bin/PKGBUILD
          # Fetches the real tarball and rewrites sha256sums itself, so the
          # checked-in PKGBUILD's hash only needs to be right for local builds.
          updpkgsums: true
          commit_username: RDMillen
          commit_email: ross@kova.md
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.VERSION }}
